name: Daily LIFE member scan

on:
  schedule:
    # 07:00 UTC = 09:00 Europe/Amsterdam during summer time.
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "daily"
        type: choice
        options:
          - daily
          - backfill_2026

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare folders
        run: mkdir -p data outputs/life_members

      - name: Collect LIFE Cooperative members
        run: python src/collect_members.py --delay 0.2

      - name: Scan member websites for recent news
        run: |
          if [ "${{ github.event.inputs.mode || 'daily' }}" = "backfill_2026" ]; then
            python src/scan_news.py --since 2026-01-01 --timeout 8 --max-pages-per-member 12 --delay 0.1
          else
            python src/scan_news.py --days 7 --timeout 8 --max-pages-per-member 8 --delay 0.1
          fi

      - name: Classify recent news
        run: |
          if [ "${{ github.event.inputs.mode || 'daily' }}" = "backfill_2026" ]; then
            python src/classify_news.py --since 2026-01-01
          else
            python src/classify_news.py --days 7
          fi

      - name: Scan external RSS feeds
        run: |
          if [ "${{ github.event.inputs.mode || 'daily' }}" = "backfill_2026" ]; then
            python src/scan_external_feeds.py --since 2026-01-01
          else
            python src/scan_external_feeds.py --days 7
          fi

      - name: Scan member vacancies
        run: python src/scan_jobs.py --timeout 8

      - name: Publish dashboard data
        run: |
          mkdir -p dashboard_data
          cp outputs/life_members/*.csv dashboard_data/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard_data/*.csv
          if git diff --cached --quiet; then
            echo "No dashboard data changes to commit."
          else
            git commit -m "Update dashboard data"
            git push
          fi

      - name: Upload database and CSV outputs
        uses: actions/upload-artifact@v4
        with:
          name: life-member-monitor-output
          path: |
            data/life_members.sqlite
            outputs/life_members/*.csv
